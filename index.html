<script>
if('serviceWorker' in navigator){
  var swReg=null, swReloaded=false;
  var swHadController=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', function(){
    if(!swHadController || swReloaded) return;
    swReloaded=true; window.location.reload();
  });
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js', {updateViaCache:'none'}).then(function(reg){
      swReg=reg;
      reg.update();
      if(reg.waiting && navigator.serviceWorker.controller){ reg.waiting.postMessage({action:'skipWaiting'}); }
      reg.addEventListener('updatefound', function(){
        var nw=reg.installing;
        if(!nw) return;
        nw.addEventListener('statechange', function(){
          if(nw.state==='installed' && navigator.serviceWorker.controller){
            nw.postMessage({action:'skipWaiting'});
          }
        });
      });
    }).catch(function(){});
  });
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState==='visible' && swReg){ swReg.update(); }
  });
}
</script>

  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;background:#000000;overflow:hidden;overscroll-behavior:none;}
  body{
    font-family:Arial,Helvetica,sans-serif;
    background:transparent;
    color:var(--negro);
    -webkit-user-select:none;user-select:none;
    touch-action:manipulation;
    overflow:hidden;overscroll-behavior:none;
  }
  body::before{content:"";position:fixed;top:0;left:0;right:0;bottom:0;background:#000000;z-index:-2;pointer-events:none;}
  body::after{content:"";position:fixed;top:0;bottom:0;left:0;right:0;margin:0 auto;width:560px;max-width:100%;background:#FFFFFF;z-index:-1;pointer-events:none;}
  body.home-active::after{background:#b0b4b8;}
  .app{position:relative;max-width:560px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;background:#FFFFFF;}

  /* iOS/iPad: el body tiene user-select:none (bueno para botones/juego), pero eso
     impide el foco/teclado en los campos. Se reactiva solo en inputs y selects. */
  input,select,textarea{-webkit-user-select:text;user-select:text;}

  /* ---------- Header ---------- */
  header{ width:100%; flex-shrink:0; background:linear-gradient(rgba(0,0,0,0.34),rgba(0,0,0,0.34)),var(--carbon); background-size:cover; background-position:center; border-bottom:4px solid #b03020; display:flex; flex-direction:column; align-items:center; padding:0; padding-top:env(safe-area-inset-top,0px); }
  header img{ width:100%; height:auto; display:block; margin-bottom:0; }
  .subtitle{ display:block; width:100%; box-sizing:border-box; font-size:0.58rem; letter-spacing:0.14em; color:#cfcfcf; text-transform:none; padding:8px 0 8px; text-align:center; background:transparent; }

  /* ---------- Cuerpo ---------- */
  main{flex:1;padding:8px 16px 4px;display:flex;flex-direction:column;gap:7px;gap:clamp(4px,1svh,9px);background:#FFFFFF;}

  .title{
    text-align:center;font-weight:700;letter-spacing:.5px;line-height:.97;
    font-size:clamp(24px,7vw,38px);color:var(--negro);text-transform:uppercase;
    margin:0;
  }

  .logo-wrap{display:flex;justify-content:center;padding:0;}
  .logo-wrap img{width:110px;width:min(30vw,110px,13svh);height:auto;display:block;}

  .group-label{
    text-align:center;color:var(--tx-gris);font-weight:700;
    letter-spacing:5px;font-size:11px;text-transform:uppercase;margin:0;
  }

  .segment{
    display:flex;border-top:4px solid #b03020;
    background:linear-gradient(rgba(0,0,0,0.20),rgba(0,0,0,0.28)),var(--carbon);
    background-size:cover;background-position:center;
  }
  .segment button{
    flex:1;border:0;background:transparent;color:#fff;
    font-family:inherit;font-weight:900;letter-spacing:1px;text-transform:uppercase;
    font-size:12px;height:36px;padding:0 4px;cursor:pointer;position:relative;
    border-right:3px solid #666;
    display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.1;
    text-shadow:0 1px 2px rgba(0,0,0,0.7);
  }
  .segment button:last-child{border-right:0;}
  .segment button.sel{background:var(--rojo);color:#fff;text-shadow:none;}
  #segEstimulo,#segEnsayos{margin-top:8px;}

  /* ---------- Acciones (mas pequenas y estrechas, como en la referencia) ---------- */
  .actions{display:flex;flex-direction:column;align-items:center;gap:6px;gap:clamp(4px,1svh,8px);margin-top:clamp(20px,4svh,40px);}

  .btn-ranking { width:75%; padding:9px; background:#fff; color:#b03020; border:2px solid #b03020; font-size:0.78rem; font-weight:900; letter-spacing:0.18em; text-transform:uppercase; cursor:pointer; text-align:center; border-radius:6px; transition:transform 0.12s; margin-top:0; }
  .btn-ranking:active{transform:translateY(3px);}


  footer{
    text-align:center;color:var(--tx-gris);font-weight:600;letter-spacing:2px;
    font-size:10px;text-transform:uppercase;padding:6px 12px 10px;
  }

  /* ===== Multi-pantalla ===== */
  .screen{flex:1;display:none;flex-direction:column;min-height:0;}
  .screen.active{display:flex;}

  /* Fondo metalizado (acero cepillado) SOLO en la pantalla de inicio.
     Va en el <main> del home (no en #home) porque main{background:#fff} lo taparia. */
  #home>main{
    background-color:#c4c8cc;
    background-image:
      linear-gradient(115deg,rgba(255,255,255,0) 30%,rgba(255,255,255,0.38) 45%,rgba(255,255,255,0) 60%),
      radial-gradient(140% 90% at 50% 0%,rgba(255,255,255,0.35) 0%,rgba(255,255,255,0.10) 35%,rgba(255,255,255,0) 70%),
      linear-gradient(180deg,#e9ecef 0%,#c9cdd1 50%,#b0b4b8 100%);
  }

  /* Navbar inferior Inicio / Repetir */
  .navbar{display:flex;gap:8px;padding:8px 14px calc(8px + env(safe-area-inset-bottom));background:#fff;}
  .nav-btn{flex:1;height:var(--ah);display:flex;align-items:center;justify-content:center;gap:8px;
    background:var(--rojo);color:#fff;border:0;border-radius:0;cursor:pointer;
    font-family:inherit;font-weight:700;letter-spacing:2px;text-transform:uppercase;font-size:14px;}
  .nav-btn svg{width:18px;height:18px;}
  .results-actions { display:flex; flex-direction:row; gap:0; width:100%; z-index:10; border-top:4px solid #b03020; margin-top:0; }
  .game-ctrl-btn { flex:1; padding:13px; background:#111; color:#fff; border:1px solid #333; border-right:none; font-size:0.82rem; font-weight:900; letter-spacing:0.12em; cursor:pointer; text-transform:uppercase; display:flex; align-items:center; justify-content:center; }
  .game-ctrl-btn:last-child { border-right:1px solid #ddd; }

  /* ----- Ejercicio ----- */
  .game-body{flex:1;display:flex;flex-direction:column;min-height:0;padding:8px 14px 11px;gap:7px;background:#fff;}
  .target-row{display:flex;align-items:center;justify-content:center;gap:14px;}
  .target-cap{font-weight:700;letter-spacing:1px;text-transform:uppercase;font-size:12px;color:var(--azul);text-align:left;line-height:1.1;}
  .target-wrap{display:flex;justify-content:center;}
  .target-box{width:72px;height:72px;border:0;display:flex;align-items:center;justify-content:center;background:#fff;flex:none;}
  .target-box svg{width:86%;height:86%;}

  .stats{display:flex;gap:8px;}
  .stat{flex:1;text-align:center;padding:2px;background:#fff;}
  .stat .k{font-weight:700;letter-spacing:1px;text-transform:uppercase;font-size:9px;color:#888;}
  .stat .v{font-weight:800;font-size:36px;line-height:1.05;color:var(--rojo);}
  .stat.main .v{color:var(--negro);}
  .substat{display:flex;justify-content:center;gap:16px;font-size:12px;color:#555;font-weight:600;}
  .substat b{color:var(--negro);}

  .prog-row{display:flex;align-items:center;gap:10px;}
  .trial-count{font-weight:800;font-size:15px;color:var(--negro);white-space:nowrap;min-width:44px;}
  .progress{flex:1;height:9px;background:var(--seg);border:2px solid var(--borde);}
  .progress > i{display:block;height:100%;background:var(--rojo);width:0%;transition:width .12s linear;}

  .grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,1fr);gap:6px;}
  .cell.empty{background:#fff;}
  .grid.covered .cell svg{visibility:hidden;}
  .cell{border:2px solid var(--negro);display:flex;align-items:center;justify-content:center;background:#fff;}
  .cell svg{width:74%;height:74%;pointer-events:none;}
  .cell:active{background:var(--seg);}

  /* Cuenta atras */
  .count{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#fff;z-index:20;}
  .count.on{display:flex;}
  .count span{font-weight:800;font-size:120px;color:var(--rojo);}

  /* Resultado / fallo */
  .center-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;background:#fff;text-align:center;}
  .res-unit{font-weight:700;letter-spacing:2px;text-transform:uppercase;font-size:13px;color:var(--azul);}
  .res-main{font-weight:800;font-size:64px;color:var(--rojo);line-height:.9;}
  .res-grid{display:flex;gap:10px;}
  .res-card{border:2px solid var(--borde);padding:8px 12px;min-width:86px;}
  .res-card .v{font-weight:800;font-size:22px;color:var(--negro);}
  .res-card .k{font-weight:700;letter-spacing:1px;text-transform:uppercase;font-size:10px;color:#888;}
  .fail-title{font-weight:800;font-size:46px;color:var(--rojo);text-transform:uppercase;line-height:.95;}
  .fail-msg{font-weight:600;font-size:16px;color:var(--negro);max-width:300px;}

  /* Ranking */
  .rank-body{flex:1;min-height:0;overflow-y:auto;padding:10px 14px;background:#fff;}
  .rank-title{text-align:center;font-weight:800;font-size:30px;text-transform:uppercase;margin-bottom:2px;}
  .rank-sub{text-align:center;font-weight:700;letter-spacing:2px;text-transform:uppercase;font-size:12px;color:var(--rojo);margin-bottom:10px;}
  .rank-row{display:grid;grid-template-columns:28px 1fr auto auto;gap:8px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--seg);}
  .rank-row .pos{font-weight:800;color:var(--rojo);text-align:center;}
  .rank-row .nm{font-weight:700;letter-spacing:1px;text-transform:uppercase;}
  .rank-row .av{font-weight:800;color:var(--negro);}
  .rank-row .tt{font-weight:600;color:#888;font-size:12px;}
  .rank-empty{text-align:center;color:#999;font-weight:600;padding:20px;}
  .cnum{font-weight:800;font-size:46px;color:var(--rojo);line-height:1;}
  .result-body{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:9px;padding:12px 14px;background:#fff;text-align:center;}
  .res-chart{width:100%;}
  .res-chart svg{width:100%;height:auto;display:block;}
  .save-row{display:flex;justify-content:center;padding:8px 16px 8px;}
  .save-row-inner{display:flex;align-items:stretch;justify-content:center;gap:8px;width:calc(60% + 92px);max-width:100%;}
  .btn-save{flex:1;max-width:60%;padding:7px;background:var(--rojo);color:#fff;border:none;border-radius:4px;font-family:inherit;font-weight:900;letter-spacing:0.1em;text-transform:uppercase;font-size:0.65rem;cursor:pointer;}
  .btn-save:disabled{background:#9A9A9A;}
  .btn-rank2{flex:none;width:84px;padding:7px;background:#111;color:#fff;border:none;border-radius:4px;font-family:inherit;font-weight:900;letter-spacing:0.1em;text-transform:uppercase;font-size:0.65rem;cursor:pointer;}
  .seg-sm button{font-size:12px;padding:7px 4px;letter-spacing:1px;}
  .rank-seg-label{text-align:center;font-weight:700;letter-spacing:2px;text-transform:uppercase;font-size:10px;color:#999;margin:6px 0 3px;}
  .rank-screen-title { font-size:1.2rem; font-weight:900; letter-spacing:0.1em; text-transform:uppercase; color:#111; text-align:center; background:#fff; padding:9px 14px 7px; border-bottom:3px solid #b03020; margin-bottom:10px; }
  .rank-tabs { display:flex; margin-bottom:0; margin-top:0; }
  .rank-tab { flex:1; padding:5px 4px; font-size:0.58rem; letter-spacing:0.06em; text-align:center; cursor:pointer; color:#999; font-weight:700; text-transform:uppercase; background:#fff; border:1px solid #000; border-right:none; }
  .rank-tab:last-child { border-right:1px solid #000; }
  .rank-tab.sel { color:#fff; background:#b03020; border-color:#000; }
  .rank-full-list { background:#fff; }
  .rank-full-row { display:flex; align-items:center; gap:8px; padding:5px 14px; border-bottom:1px solid #f0f0f0; }
  .rank-full-row.rank-full-me { background:#fff2ee; box-shadow:inset 3px 0 0 #b03020; }
  .rank-full-row.rank-full-me .rank-full-name { color:#b03020; font-weight:900; }
  .rank-full-row.rank-full-me.me-grey { background:#f0f0f0; box-shadow:inset 3px 0 0 #9A9A9A; }
  .rank-full-row.rank-full-me.me-grey .rank-full-name { color:#555; }
  .rank-full-pos { font-size:0.72rem; font-weight:900; color:#555; width:22px; }
  .rank-full-pos.gold { color:#c9a227; }
  .rank-full-pos.silver { color:#8e9eab; }
  .rank-full-pos.bronze { color:#c07941; }
  .rank-full-name { flex:1; font-size:0.72rem; font-weight:700; color:#111; }
  .rank-full-ms { font-size:0.72rem; font-weight:900; color:#b03020; }
  .rank-full-date { font-size:0.5rem; color:#555; }
  .rank-full-empty { text-align:center; padding:24px; font-size:0.62rem; color:#ccc; letter-spacing:0.1em; }
  #segModoR,#segEstR,#segEnsR{margin-bottom:4px;}
  #rkList{margin-top:10px;}
  .res-quad{width:100%;height:clamp(200px,27svh,238px);display:grid;grid-template-columns:1.28fr 1fr;grid-template-rows:1.62fr 1fr;}
  .rq{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6px 8px;gap:2px;min-width:0;min-height:0;}
  .rq:nth-child(1){border-right:3px solid var(--rojo);border-bottom:3px solid var(--rojo);}
  .rq:nth-child(2){border-bottom:3px solid var(--rojo);}
  .rq:nth-child(3){border-right:3px solid var(--rojo);}
  .rq-k{font-weight:700;letter-spacing:1px;text-transform:uppercase;font-size:10px;color:#9A9A9A;}
  .rq-v{font-weight:800;font-size:34px;line-height:1;color:var(--negro);}
  .rq-media .rq-main{font-weight:800;font-size:46px;line-height:1;color:var(--rojo);}
  @keyframes blinkop{0%,100%{opacity:1}50%{opacity:.2}}
  .blink{animation:blinkop .9s ease-in-out infinite;}
  .res-msg{font-weight:800;text-transform:uppercase;letter-spacing:1px;font-size:20px;color:var(--rojo);text-align:center;}
  .res-ens{font-weight:700;font-size:15px;color:var(--negro);text-align:center;}
  .res-ens b{font-size:22px;color:var(--rojo);}
  #btn-start-wrap { display:flex; align-items:center; justify-content:center; padding:4px; margin:5px auto 3px; border-radius:50%; background:conic-gradient(#ffffff,#9a9a9a,#e8e8e8,#5a5a5a,#ffffff,#8a8a8a,#dcdcdc,#666666,#ffffff); box-shadow:0 5px 12px rgba(0,0,0,0.6); transition:transform 0.08s, box-shadow 0.08s; }
  #btn-start-wrap:active { transform:translateY(3px); box-shadow:0 2px 6px rgba(0,0,0,0.6); }
  #btn-start { width:70px; height:70px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #e84030 0%, #b03020 45%, #7a1a10 100%); border:none; color:#fff; font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif; font-weight:900; font-size:0.6rem; letter-spacing:0.18em; text-transform:uppercase; cursor:pointer; position:relative; box-shadow:inset 0 2px 4px rgba(255,255,255,0.28), inset 0 -3px 6px rgba(0,0,0,0.5); transition:transform 0.08s; }
  #btn-start:active { box-shadow:inset 0 3px 7px rgba(0,0,0,0.6); }
  #user-name-bar { width:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0 0 5px; box-sizing:border-box; gap:0; }

  /* Overlay "Ejercicio finalizado" (modal a pantalla completa, 1s antes de resultados) */
  #transition-overlay { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:#111; z-index:9999; align-items:center; justify-content:center; flex-direction:column; }
  #transition-overlay.active { display:flex; }
  #transition-text { color:#fff; font-size:1.6rem; font-weight:900; font-family:Arial,sans-serif; letter-spacing:0.05em; text-align:center; text-transform:uppercase; border-top:4px solid #b03020; border-bottom:4px solid #b03020; padding:16px 30px; }
</style>

<script>
"use strict";
var SYMS = [["circle","cross"],["circle","dot"],["circle","hline"],["circle","vline"],["circle","concentric"],["circle","twodots"],["octagon","cross"],["octagon","dot"],["octagon","hline"],["octagon","vline"],["octagon","concentric"],["octagon","twodots"],["diamond","innershape"],["diamond","dot"],["diamond","hline"],["diamond","vline"],["diamond","diag"],["diamond","diag2"],["diamond","concentric"],["diamond","twodots"],["tri_up","innershape"],["tri_up","dot"],["tri_up","hline"],["tri_up","vline"],["tri_up","diag"],["tri_up","concentric"],["tri_up","twodots"],["hexagon","cross"],["hexagon","dot"],["hexagon","hline"],["hexagon","vline"],["hexagon","diag"],["hexagon","concentric"],["hexagon","twodots"],["trapezoid","innershape"],["trapezoid","dot"],["trapezoid","hline"],["trapezoid","vline"],["trapezoid","diag"],["trapezoid","diag2"],["trapezoid","concentric"],["trapezoid","twodots"],["parallel","innershape"],["parallel","dot"],["parallel","hline"],["parallel","vline"],["parallel","diag"],["parallel","diag2"],["parallel","concentric"],["parallel","twodots"]];
var SWG=4.5;
function shapePts(name){
  function reg(n,r,rot){ var a=[],k; for(k=0;k<n;k++){ a.push([50+r*Math.cos(rot+2*Math.PI*k/n),50+r*Math.sin(rot+2*Math.PI*k/n)]); } return a; }
  if(name==='diamond') return reg(4,40,Math.PI/2);
  if(name==='tri_up') return [[50,16],[82,78],[18,78]];
  if(name==='hexagon') return reg(6,36,0);
  if(name==='octagon') return reg(8,36,Math.PI/8);
  if(name==='trapezoid') return [[30,28],[70,28],[84,76],[16,76]];
  if(name==='parallel') return [[30,30],[86,30],[70,74],[14,74]];
  return reg(24,34,0);
}
function pathOf(pts){
  var d='M ',i;
  for(i=0;i<pts.length;i++){ d+=(i?'L ':'')+pts[i][0].toFixed(1)+' '+pts[i][1].toFixed(1)+' '; }
  return d+'Z'? '<path d="'+d+'Z" fill="none" stroke="#111" stroke-width="'+SWG+'" stroke-linejoin="round"/>' : '';
}
function scaleP(pts,s){ var o=[],i; for(i=0;i<pts.length;i++){ o.push([50+(pts[i][0]-50)*s,50+(pts[i][1]-50)*s]); } return o; }
function glyphSVG(idx){
  var sp=SYMS[idx], o=sp[0], it=sp[1];
  var s='<svg viewBox="0 0 100 100">';
  if(o==='circle'){ s+='<circle cx="50" cy="50" r="34" fill="none" stroke="#111" stroke-width="'+SWG+'"/>'; }
  else { s+=pathOf(shapePts(o)); }
  function ln(a,b){ return '<line x1="'+a[0].toFixed(1)+'" y1="'+a[1].toFixed(1)+'" x2="'+b[0].toFixed(1)+'" y2="'+b[1].toFixed(1)+'" stroke="#111" stroke-width="'+SWG+'" stroke-linecap="round"/>'; }
  function fd(x,y,r){ return '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="#111"/>'; }
  if(it==='dot') s+=fd(50,50,5);
  else if(it==='hline') s+=ln([30,50],[70,50]);
  else if(it==='vline') s+=ln([50,30],[50,70]);
  else if(it==='diag') s+=ln([32,68],[68,32]);
  else if(it==='diag2') s+=ln([32,32],[68,68]);
  else if(it==='twodots') s+=fd(38,50,4)+fd(62,50,4);
  else if(it==='concentric'){
    if(o==='circle'){ s+='<circle cx="50" cy="50" r="15.3" fill="none" stroke="#111" stroke-width="'+SWG+'"/>'; }
    else { s+=pathOf(scaleP(shapePts(o),0.45)); }
  }
  else if(it==='cross'){ s+=ln([30,50],[70,50])+ln([50,30],[50,70]); }
  else if(it==='innershape'){
    if(o==='circle'){ s+=pathOf(scaleP(shapePts('diamond'),0.4)); }
    else { s+='<circle cx="50" cy="50" r="13" fill="none" stroke="#111" stroke-width="'+SWG+'"/>'; }
  }
  return s+'</svg>';
}

function $(id){ return document.getElementById(id); }
function show(id){ var s=document.querySelectorAll('.screen'); for(var i=0;i<s.length;i++) s[i].classList.remove('active'); $(id).classList.add('active'); document.body.classList.toggle('home-active', id==='home'); }
function two(n){ return (n<10?'0':'')+n; }
function fmtTime(ms){ var cs=Math.floor(ms/10), cc=cs%100, s=Math.floor(cs/100), sec=s%60, m=Math.floor(s/60); return m+':'+two(sec)+'.'+two(cc); }
function fmtDate(ts){ if(!ts) return ''; var d=new Date(ts); return two(d.getDate())+'/'+two(d.getMonth()+1); }
function fmtRT(ms){ return (ms/1000).toFixed(2); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

var AC=null;
function audioCtx(){
  try{
    if(!AC){ AC=new (window.AudioContext||window.webkitAudioContext)(); }
    if(AC.state==='suspended'){ AC.resume(); }
  }catch(e){ AC=null; }
  return AC;
}
function tone(type,f0,f1,start,dur,vol){
  var ctx=AC; if(!ctx) return;
  var o=ctx.createOscillator(), g=ctx.createGain();
  o.type=type; o.frequency.setValueAtTime(f0,start);
  if(f1){ o.frequency.exponentialRampToValueAtTime(f1,start+dur); }
  g.gain.setValueAtTime(0.0001,start);
  g.gain.exponentialRampToValueAtTime(vol,start+0.006);
  g.gain.exponentialRampToValueAtTime(0.0001,start+dur);
  o.connect(g); g.connect(ctx.destination);
  o.start(start); o.stop(start+dur+0.03);
}
function sndButton(){ var c=audioCtx(); if(!c) return; tone('triangle',520,0,c.currentTime,0.055,0.16); }
function sndSymbol(){ var c=audioCtx(); if(!c) return; tone('sine',780,940,c.currentTime,0.085,0.20); }
function sndFail(){ var c=audioCtx(); if(!c) return; var t=c.currentTime; tone('square',196,0,t,0.14,0.17); tone('square',146,0,t+0.13,0.20,0.17); }


function seg(id){
  var box=$(id);
  box.addEventListener('click', function(e){
    var b=e.target.closest('button'); if(!b) return;
    var all=box.querySelectorAll('button');
    for(var i=0;i<all.length;i++) all[i].classList.remove('sel');
    b.classList.add('sel');
  });
}
function selVal(id){ var b=$(id).querySelector('button.sel'); return b?b.getAttribute('data-v'):null; }

var S={mode:'normal',stim:'fijo',total:15,name:'RDS',sport:'',target:0,curTarget:0,cellSyms:[],targetOrder:[],trial:0,times:[],t0:0,trialT0:0,running:false,raf:0,lock:true,countIv:0,coverTo:0,curLimit:0,limitTo:0,resEnsayos:0};

function filterInitials(el){ el.value=el.value.replace(/[^A-Za-z]/g,'').toUpperCase(); }
function startGame(){
  S.mode=selVal('segModo')||'normal';
  S.stim=selVal('segEstimulo')||'fijo';
  S.total=parseInt(selVal('segEnsayos')||'5',10);
  var nm=($('user-ini-input').value||'RDS').toUpperCase().replace(/[^A-Z]/g,'').slice(0,3);
  S.name=nm||'RDS';
  S.sport=($('user-sport-select')&&$('user-sport-select').value)||'';
  runGame();
}
function repeatGame(){ runGame(); }

function shuffleArr(a){ var i,j,t; for(i=a.length-1;i>0;i--){ j=Math.floor(Math.random()*(i+1)); t=a[i];a[i]=a[j];a[j]=t; } return a; }

function limitMs(stim,total,k){
  var up=(stim==='fijo')?4000:5000, lo=(stim==='fijo')?1500:2500;
  var lastN=Math.round(total/5), de=total-lastN+1;
  if(de<2) de=2;
  if(k>=de) return lo;
  return Math.round(up+(lo-up)*(k-1)/(de-1));
}

function setupHud(){
  if(S.mode==='limite'){
    $('stTimeK').textContent='L\u00edmite';
    $('stAvgK').textContent='\u00daltima react.';
    $('stTime').classList.add('blink');
    $('stTime').textContent=limitMs(S.stim,S.total,1)+' ms';
    $('stAvg').textContent='--';
  } else {
    $('stTimeK').textContent='Tiempo';
    $('stAvgK').textContent='Media react.';
    $('stTime').classList.remove('blink');
  }
}

function runGame(){
  if(S.countIv){ clearInterval(S.countIv); S.countIv=0; }
  if(S.coverTo){ clearTimeout(S.coverTo); S.coverTo=0; }
  if(S.limitTo){ clearTimeout(S.limitTo); S.limitTo=0; }
  show('game');
  $('grid').classList.remove('covered');
  S.trial=0; S.times=[]; S.lock=true; S.running=false;
  if(S.mode!=='normal'){
    S.target=Math.floor(Math.random()*SYMS.length);
    S.zoneSeq=buildZoneSeq(S.total);
  } else {
    var pool=[],i; for(i=0;i<SYMS.length;i++) pool.push(i);
    shuffleArr(pool);
    S.cellSyms=pool.slice(0,25);
    if(S.stim==='cambia'){
      var ord=[]; for(i=0;i<25;i++) ord.push(i);
      S.targetOrder=shuffleArr(ord);
    } else {
      S.target=S.cellSyms[Math.floor(Math.random()*25)];
    }
  }
  $('targetBox').innerHTML='';
  updateStats(); setProgress(0); $('stTime').textContent='0:00.00';
  $('trialCount').textContent='1/'+S.total;
  setupHud();
  countdownGrid();
  countdown(beginPlay);
}

function countdownGrid(){
  var html='',k;
  for(k=0;k<25;k++){
    if(k===12){ html+='<div class="cell"><span class="cnum" id="countNum">3</span></div>'; }
    else { html+='<div class="cell"></div>'; }
  }
  $('grid').innerHTML=html;
}

function countdown(cb){
  var seq=['3','2','1'], i=0, e=$('countNum'); if(e) e.textContent='3';
  S.countIv=setInterval(function(){
    i++;
    if(i<seq.length){ var n=$('countNum'); if(n) n.textContent=seq[i]; }
    else { clearInterval(S.countIv); S.countIv=0; cb(); }
  },700);
}

function beginPlay(){
  S.running=true; S.t0=performance.now();
  if(S.mode!=='normal'){
    extremoTrial();
  } else {
    renderStaticGrid();
    if(S.stim==='cambia'){ normalTrial(); } else { normalFijoStart(); }
  }
  cronoLoop();
}

function renderStaticGrid(){
  var html='',k;
  for(k=0;k<25;k++){ html+='<div class="cell" data-g="'+S.cellSyms[k]+'">'+glyphSVG(S.cellSyms[k])+'</div>'; }
  $('grid').innerHTML=html;
}

function normalTrial(){
  S.lock=false;
  $('trialCount').textContent=(S.trial+1)+'/'+S.total;
  var cellIdx=S.targetOrder[S.trial];
  S.curTarget=S.cellSyms[cellIdx];
  $('targetBox').innerHTML=glyphSVG(S.curTarget);
  S.trialT0=performance.now();
}

function normalFijoStart(){
  S.lock=false;
  $('trialCount').textContent='1/'+S.total;
  S.curTarget=S.target;
  $('targetBox').innerHTML=glyphSVG(S.curTarget);
  S.trialT0=performance.now();
}

function normalFijoNext(){
  S.lock=true;
  $('trialCount').textContent=(S.trial+1)+'/'+S.total;
  var grid=$('grid'); grid.classList.add('covered');
  S.coverTo=setTimeout(function(){
    var cells=grid.querySelectorAll('.cell'), present=[], i;
    for(i=0;i<cells.length;i++){ if(cells[i].getAttribute('data-g')!==null) present.push(cells[i]); }
    if(present.length){
      var c=present[Math.floor(Math.random()*present.length)];
      c.setAttribute('data-g', S.target); c.innerHTML=glyphSVG(S.target);
    }
    grid.classList.remove('covered');
    S.curTarget=S.target; S.trialT0=performance.now(); S.lock=false; S.coverTo=0;
  }, 420);
}
function cronoLoop(){
  if(!S.running) return;
  if(S.mode!=='limite'){ $('stTime').textContent=fmtTime(performance.now()-S.t0); }
  S.raf=requestAnimationFrame(cronoLoop);
}

var ZONES=[
  [2,7,10,11,12,13,14,17,22],
  [0,1,5,6],
  [3,4,8,9],
  [15,16,20,21],
  [18,19,23,24]
];
function buildZoneSeq(total){
  var seq=[], per=Math.floor(total/5), z, r, i, j, t;
  for(z=0;z<5;z++){ for(r=0;r<per;r++){ seq.push(z); } }
  while(seq.length<total){ seq.push(Math.floor(Math.random()*5)); }
  for(i=seq.length-1;i>0;i--){ j=Math.floor(Math.random()*(i+1)); t=seq[i]; seq[i]=seq[j]; seq[j]=t; }
  return seq;
}

function extremoTrial(){
  S.lock=false;
  $('trialCount').textContent=(S.trial+1)+'/'+S.total;
  S.curTarget=(S.stim==='cambia')?Math.floor(Math.random()*SYMS.length):S.target;
  $('targetBox').innerHTML=glyphSVG(S.curTarget);
  var pool=[], i, j, t;
  for(i=0;i<SYMS.length;i++){ if(i!==S.curTarget) pool.push(i); }
  for(i=pool.length-1;i>0;i--){ j=Math.floor(Math.random()*(i+1)); t=pool[i]; pool[i]=pool[j]; pool[j]=t; }
  var distract=pool.slice(0,24);
  var zone=ZONES[S.zoneSeq[S.trial]];
  var pos=zone[Math.floor(Math.random()*zone.length)];
  var cells=new Array(25), di=0, k;
  for(k=0;k<25;k++){ cells[k]=(k===pos)?S.curTarget:distract[di++]; }
  var html='';
  for(k=0;k<25;k++){ html+='<div class="cell" data-g="'+cells[k]+'">'+glyphSVG(cells[k])+'</div>'; }
  $('grid').innerHTML=html;
  S.trialT0=performance.now();
  if(S.mode==='limite'){
    S.curLimit=limitMs(S.stim,S.total,S.trial+1);
    $('stTime').textContent=S.curLimit+' ms';
    if(S.limitTo){ clearTimeout(S.limitTo); }
    S.limitTo=setTimeout(limitTimeout, S.curLimit);
  }
}

function onPick(cell){
  if(S.lock) return;
  var gattr=cell.getAttribute('data-g');
  if(gattr===null) return;
  var g=parseInt(gattr,10);
  if(g===S.curTarget){
    sndSymbol();
    var rt=performance.now()-S.trialT0;
    if(S.limitTo){ clearTimeout(S.limitTo); S.limitTo=0; }
    S.times.push(rt); S.trial++;
    setProgress(S.trial/S.total); updateStats();
    if(S.mode==='limite'){ $('stAvg').textContent=Math.round(rt)+' ms'; }
    if(S.mode==='normal'){
      cell.removeAttribute('data-g'); cell.classList.add('empty'); cell.innerHTML='';
      if(S.trial>=S.total){ finish(); }
      else if(S.stim==='cambia'){ normalTrial(); }
      else { normalFijoNext(); }
    } else {
      if(S.trial>=S.total){ if(S.mode==='limite'){ finishLimite(true); } else { finish(); } }
      else { extremoTrial(); }
    }
  } else {
    sndFail();
    if(S.limitTo){ clearTimeout(S.limitTo); S.limitTo=0; }
    S.lock=true; S.running=false; cancelAnimationFrame(S.raf);
    show('fail');
  }
}

function setProgress(frac){ $('prog').style.width=(Math.max(0,Math.min(1,frac))*100)+'%'; }

function calc(){
  var n=S.times.length, sum=0, best=Infinity, worst=0;
  for(var i=0;i<n;i++){ sum+=S.times[i]; if(S.times[i]<best) best=S.times[i]; if(S.times[i]>worst) worst=S.times[i]; }
  return {n:n, sum:sum, avg:n?sum/n:0, best:best===Infinity?0:best, worst:worst};
}
function updateStats(){
  if(S.mode==='limite') return;
  var c=calc();
  $('stAvg').textContent = c.n===0 ? '--' : fmtRT(c.avg);
}

function renderChart(times){
  var box=$('resChart'); if(!box) return;
  var n=times.length; if(n===0){ box.innerHTML=''; return; }
  var W=320,H=132,padL=12,padR=12,padT=12,padB=22;
  var min=Math.min.apply(null,times), max=Math.max.apply(null,times), span=(max-min)||1;
  var pw=W-padL-padR, ph=H-padT-padB, base=padT+ph, i;
  function X(i){ return n===1?padL+pw/2:padL+(i/(n-1))*pw; }
  function Y(v){ return padT+(1-(v-min)/span)*ph; }
  var pts=[]; for(i=0;i<n;i++){ pts.push([X(i),Y(times[i])]); }
  var area='M '+pts[0][0].toFixed(1)+' '+base.toFixed(1);
  for(i=0;i<n;i++){ area+=' L '+pts[i][0].toFixed(1)+' '+pts[i][1].toFixed(1); }
  area+=' L '+pts[n-1][0].toFixed(1)+' '+base.toFixed(1)+' Z';
  var poly=''; for(i=0;i<n;i++){ poly+=(i?' ':'')+pts[i][0].toFixed(1)+','+pts[i][1].toFixed(1); }
  var s='<svg viewBox="0 0 '+W+' '+H+'">';
  s+='<path d="'+area+'" fill="rgba(162,58,41,0.10)" stroke="none"/>';
  s+='<polyline points="'+poly+'" fill="none" stroke="#A23A29" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
  var step=n<=12?1:5;
  for(i=0;i<n;i++){
    if(i===0||i===n-1||((i+1)%step)===0){
      s+='<text x="'+pts[i][0].toFixed(1)+'" y="'+(H-7)+'" text-anchor="middle" font-family="Arial" font-size="9" fill="#9A9A9A">'+(i+1)+'</text>';
    }
  }
  box.innerHTML=s+'</svg>';
}

function lbKey(mode,stim,total){ return 'rds_pst_'+mode+'_'+stim+'_'+total; }
function loadLb(k){ try{ return JSON.parse(localStorage.getItem(k)||'[]'); }catch(e){ return []; } }
function sortLb(lb,mode){
  if(mode==='limite'){ lb.sort(function(a,b){ return (b.ensayos-a.ensayos)||(a.avg-b.avg); }); }
  else { lb.sort(function(a,b){ return a.avg-b.avg; }); }
}
function saveScore(avg,total){
  var nm = S.sport ? (S.name+'-'+S.sport) : S.name;
  var rec={ mode:S.mode, stim:S.stim, total:S.total, name:nm, ensayos:S.resEnsayos, avg:Math.round(avg), tt:Math.round(total), ts:Date.now() };
  var k=lbKey(S.mode,S.stim,S.total), lb=loadLb(k);
  lb.push(rec); sortLb(lb,S.mode); lb=lb.slice(0,50);
  try{ localStorage.setItem(k,JSON.stringify(lb)); }catch(e){}
  S.lastRec=rec; S.lastRecKey=k;
  if(window.fbSave){ window.fbSave(rec); }
}

function setSeg(id,val){

var hideRepeated=true;

function toggleHideRepeated(){
  hideRepeated=!hideRepeated;

  if(btn) btn.textContent=hideRepeated?'Mostrar repetidos':'Ocultar repetidos';
  rankFromSel();

function filterRepeated(list){
  var max=hideRepeated?1:3;
  var seen={}, result=[];
  for(var i=0;i<list.length;i++){
    var name=(list[i].name||'').toLowerCase().trim();
    var c=seen[name]||0;
    if(c<max){ seen[name]=c+1; result.push(list[i]); }
  }
  return result;
}

function getHomeName(){
  var iniEl=document.getElementById('user-ini-input');
  var sptEl=document.getElementById('user-sport-select');
  if(!iniEl||!sptEl) return '';
  var nm=((iniEl.value||'RDS').toUpperCase().replace(/[^A-Z]/g,'').slice(0,3))||'RDS';
  var sport=(sptEl.value||'').trim().toUpperCase();
  return sport ? (nm+'-'+sport) : nm;
}

function renderRankList(list, el, m, latest){
  list=filterRepeated(list);
  function rankBetter(a,b){
    if(a==null) return false; if(b==null) return true;
    var av=(a.avg==null?9999:a.avg), bv=(b.avg==null?9999:b.avg);
    if(m==='limite'){
      var ae=(a.ensayos||0), be=(b.ensayos||0);
      return ae>be || (ae===be && av<bv);
    }
    return av<bv;
  }
  var medals=['gold','silver','bronze'];
  var meName=getHomeName();
  var myIdx=-1, myEntry=null;
  if(meName){
    for(var k=0;k<list.length;k++){
      if((list[k].name||'').trim().toUpperCase()===meName){ myIdx=k; myEntry=list[k]; break; }
    }
  }
  el.innerHTML='';
  var display=list.slice(0,15);
  if(!display.length){
    var d=document.createElement('div');d.className='rank-full-empty';
    d.textContent='Sin resultados';el.appendChild(d);return;
  }
  function buildRow(entry, posLabel, medalIdx, isMe, grey){
    var row=document.createElement('div');row.className='rank-full-row'+(isMe?' rank-full-me':'')+(isMe&&grey?' me-grey':'');
    var pos=document.createElement('div');
    pos.className='rank-full-pos'+(medalIdx>=0 && medalIdx<3?' '+medals[medalIdx]:'');
    pos.textContent=posLabel;
    var nm=document.createElement('div');nm.className='rank-full-name';nm.textContent=entry.name;
    var ms=document.createElement('div');ms.className='rank-full-ms';
    ms.textContent=entry.avg+' ms';
    var dt=document.createElement('div');dt.className='rank-full-date';dt.textContent=entry.ts?fmtDate(entry.ts):'';
    row.appendChild(pos);row.appendChild(nm);row.appendChild(ms);row.appendChild(dt);
    return row;
  }
  for(var i=0;i<display.length;i++){
    var rowName=(display[i].name||'').trim().toUpperCase();
    var isMe=meName && rowName===meName;
    el.appendChild(buildRow(display[i], (i+1), i, isMe));
  }
  if(myEntry && myIdx>=15){
    var posLabel=(myIdx+1>=100)?'100+':String(myIdx+1);
    el.appendChild(buildRow(myEntry, posLabel, -1, true));
  }
  if(latest){
    var shownTs={};
    for(var s2=0;s2<display.length;s2++){ if(display[s2].ts!=null) shownTs[display[s2].ts]=1; }
    var bestExtra=(myEntry && myIdx>=15 && myEntry.ts===latest.ts);
    if(!shownTs[latest.ts] && !bestExtra){
      var lpos=1;
      for(var q=0;q<list.length;q++){ if(rankBetter(list[q], latest)) lpos++; }
      var greyLatest=!!(myEntry && myIdx<15 && rankBetter(myEntry, latest));
      el.appendChild(buildRow(latest, (lpos>=100?'100+':String(lpos)), -1, true, greyLatest));
    }
  }
}

}

function capName(rows,max){
  var seen={}, out=[], i, nm;
  for(i=0;i<rows.length;i++){
    nm=rows[i].name||'';
    seen[nm]=(seen[nm]||0)+1;
    if(seen[nm]<=max){ out.push(rows[i]); }
  }
  return out;
}
function renderRank(mode,stim,total){
  var key=lbKey(mode,stim,total); S.rankKey=key;
  var el=$('rkList'); if(!el) return;
  var latest=null;
  if(S.saved===false && isFinite(S.resAvg) && lbKey(S.mode,S.stim,S.total)===key){
    latest={ name:(S.sport?(S.name+'-'+S.sport):S.name), avg:Math.round(S.resAvg), ensayos:S.resEnsayos, ts:Date.now() };
  } else if(S.lastRec && S.lastRecKey===key){
    latest=S.lastRec;
  }
  var lbLocal=loadLb(key);
  sortLb(lbLocal, mode);
  renderRankList(lbLocal, el, mode, latest);
  if(window.fbLoad){
    window.fbLoad(mode,stim,total).then(function(rows){
      if(rows && S.rankKey===key){
        sortLb(rows, mode);
        renderRankList(rows, el, mode, latest);
      }
    }).catch(function(){});
  }
}
