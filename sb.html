<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFFFF">
<meta name="color-scheme" content="light">
<link rel="manifest" href="sb-manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<title>SB check</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#FFFFFF;overflow:hidden;overscroll-behavior:none;color-scheme:light;}
  *{box-sizing:border-box;}
  .app{max-width:560px;margin:0 auto;min-height:100svh;display:flex;flex-direction:column;background:#FFFFFF;}
  /* cabecera negra igual que perception */
  header{width:100%;flex-shrink:0;background:#111;display:flex;flex-direction:column;align-items:center;padding:0;border-bottom:4px solid #b03020;}
  header .white{background:#fff;width:100%;display:flex;justify-content:center;padding:6px 0;font:700 12px Arial;color:#111;}
  #probe{position:fixed;top:0;left:0;width:1px;height:env(safe-area-inset-top);}
  #probeB{position:fixed;bottom:0;left:0;width:1px;height:env(safe-area-inset-bottom);}
  pre{font:13px/1.5 -apple-system,Menlo,monospace;padding:14px;margin:0;white-space:pre-wrap;word-break:break-word;}
  .k{color:#888;}
</style>
</head>
<body>
<div id="probe"></div><div id="probeB"></div>
<div class="app">
  <header><div class="white">CABECERA NEGRA (como perception) — mira el color de la barra de la hora</div></header>
  <pre id="out">midiendo...</pre>
</div>
<script>
function px(el){ return getComputedStyle(el).height; }
setTimeout(function(){
  var mm = function(q){ try { return matchMedia(q).matches; } catch(e){ return 'err'; } };
  var themeMeta = document.querySelector('meta[name="theme-color"]');
  var sbMeta = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
  var vv = window.visualViewport || {};
  var lines = [
    ['navigator.standalone', String(navigator.standalone)],
    ['display-mode: standalone', mm('(display-mode: standalone)')],
    ['display-mode: fullscreen', mm('(display-mode: fullscreen)')],
    ['display-mode: browser', mm('(display-mode: browser)')],
    ['prefers-color-scheme: dark', mm('(prefers-color-scheme: dark)')],
    ['prefers-color-scheme: light', mm('(prefers-color-scheme: light)')],
    ['safe-area-inset-top', px(document.getElementById('probe'))],
    ['safe-area-inset-bottom', px(document.getElementById('probeB'))],
    ['window.innerHeight', window.innerHeight],
    ['window.outerHeight', window.outerHeight],
    ['screen.height', screen.height],
    ['screen.availHeight', screen.availHeight],
    ['visualViewport.height', Math.round(vv.height||0)],
    ['visualViewport.offsetTop', Math.round(vv.offsetTop||0)],
    ['devicePixelRatio', window.devicePixelRatio],
    ['meta theme-color', themeMeta ? themeMeta.content : '(ninguna)'],
    ['meta status-bar-style', sbMeta ? sbMeta.content : '(ninguna)'],
    ['location', location.href]
  ];
  document.getElementById('out').textContent = lines.map(function(l){ return l[0] + ':  ' + l[1]; }).join('\n');
}, 300);
</script>
</body>
</html>
