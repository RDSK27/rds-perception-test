<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFFFF">
<meta name="color-scheme" content="light">
<link rel="manifest" href="sb2-manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<title>SB2 check</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;background:#FFFFFF;overflow:hidden;overscroll-behavior:none;color-scheme:light;}
  /* LA UNICA DIFERENCIA con sb.html: body fijado arriba, como perception/lights/processing/rallymemory */
  body{position:fixed;top:0;left:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;font-family:Arial,sans-serif;color:#111;}
  .app{position:relative;max-width:560px;margin:0 auto;min-height:100svh;display:flex;flex-direction:column;background:#FFFFFF;}
  header{width:100%;flex-shrink:0;background:#111;display:flex;flex-direction:column;align-items:center;padding:0;border-bottom:4px solid #b03020;}
  header .white{background:#fff;width:100%;display:flex;justify-content:center;padding:6px 0;font:700 12px Arial;color:#111;text-align:center;}
  pre{font:13px/1.5 -apple-system,Menlo,monospace;padding:14px;margin:0;white-space:pre-wrap;word-break:break-word;}
</style>
</head>
<body>
<div class="app">
  <header><div class="white">SB2 — body position:fixed (como perception). ¿Barra de la hora NEGRA?</div></header>
  <pre id="out">midiendo...</pre>
</div>
<script>
setTimeout(function(){
  var mm = function(q){ try { return matchMedia(q).matches; } catch(e){ return 'err'; } };
  document.getElementById('out').textContent = [
    'navigator.standalone: ' + navigator.standalone,
    'display-mode standalone: ' + mm('(display-mode: standalone)'),
    'prefers-color-scheme dark: ' + mm('(prefers-color-scheme: dark)'),
    'innerHeight: ' + window.innerHeight,
    'screen.height: ' + screen.height,
    'ESTA es sb2 (body position:fixed)'
  ].join('\n');
}, 300);
</script>
</body>
</html>
